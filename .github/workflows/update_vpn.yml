name: Auto-update VPN Subscriptions & Keys

on:
  schedule:
    # Запуск каждые 2 часа
    - cron: '0 */2 * * *'
  workflow_dispatch: # Возможность запустить вручную кнопкой в GitHub Actions
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  update-vpn:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Discover new VPNs and collect keys
        run: |
          python vpn_finder.py --max-ping 200 --threads 40

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add valid_subscriptions.txt history_subs.txt working_keys.txt
          
          # Проверяем, есть ли изменения перед коммитом
          if git diff --staged --quiet; then
            echo "No changes detected, skipping commit."
          else
            git commit -m "Auto-update VPN keys and subscriptions [skip ci]"
            git push origin main
          fi
